<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <filter id="crayonShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#166534" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="crayonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A3E635"/>
      <stop offset="50%" stop-color="#65A30D"/>
      <stop offset="100%" stop-color="#4D7C0F"/>
    </linearGradient>
    <linearGradient id="wrapperBeige" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF9C3"/>
      <stop offset="50%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>
  </defs>

  <g transform="rotate(-35 32 32)" filter="url(#crayonShadow)">
    <!-- Crayon Body Base -->
    <rect x="24" y="16" width="16" height="36" rx="3" fill="url(#crayonGreen)" stroke="#365314" stroke-width="2"/>

    <!-- Pointed Tip -->
    <path d="M 24 16 L 32 4 L 40 16 Z" fill="url(#crayonGreen)" stroke="#365314" stroke-width="2" stroke-linejoin="round"/>

    <!-- Paper Sleeve Wrapper -->
    <rect x="23" y="22" width="18" height="22" rx="2" fill="url(#wrapperBeige)" stroke="#365314" stroke-width="2"/>

    <!-- Decorative Bands on Wrapper -->
    <line x1="23" y1="26" x2="41" y2="26" stroke="#4D7C0F" stroke-width="1.8"/>
    <line x1="23" y1="40" x2="41" y2="40" stroke="#4D7C0F" stroke-width="1.8"/>
    
    <!-- Oval Label / Face -->
    <ellipse cx="32" cy="33" rx="4.5" ry="3" fill="#FFFFFF" stroke="#4D7C0F" stroke-width="1"/>
    <circle cx="30.5" cy="33" r="0.8" fill="#1E293B"/>
    <circle cx="33.5" cy="33" r="0.8" fill="#1E293B"/>
    <path d="M 31.2 34.5 Q 32 35.2 32.8 34.5" stroke="#1E293B" stroke-width="0.6" fill="none"/>

    <!-- Highlight Reflection -->
    <path d="M 26 18 L 26 48" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
  </g>
</svg>