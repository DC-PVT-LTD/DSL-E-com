<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <radialGradient id="starYellow" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="30%" stop-color="#FEF08A"/>
      <stop offset="70%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </radialGradient>
    <filter id="starShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="1.8" flood-color="#B45309" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Cute Chubby 5-Pointed Star -->
  <g filter="url(#starShadow)">
    <path d="M 32 6
             C 34 6, 37 15, 41 18
             C 45 20, 56 20, 57 23
             C 58 26, 50 33, 49 38
             C 47 43, 51 54, 48 56
             C 45 58, 36 51, 32 51
             C 28 51, 19 58, 16 56
             C 13 54, 17 43, 15 38
             C 14 33, 6 26, 7 23
             C 8 20, 19 20, 23 18
             C 27 15, 30 6, 32 6 Z"
          fill="url(#starYellow)" stroke="#D97706" stroke-width="2.5" stroke-linejoin="round"/>
  </g>

  <!-- Specular Curve Highlight -->
  <path d="M 32 10 C 33 10, 36 17, 39 19 C 43 21, 51 21, 52 23"
        stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.75"/>

  <!-- Cute Kawaii Face -->
  <!-- Left Eye -->
  <ellipse cx="25" cy="31" rx="2.5" ry="3" fill="#1E293B"/>
  <circle cx="24" cy="30" r="1" fill="#FFFFFF"/>

  <!-- Right Eye -->
  <ellipse cx="39" cy="31" rx="2.5" ry="3" fill="#1E293B"/>
  <circle cx="38" cy="30" r="1" fill="#FFFFFF"/>

  <!-- Happy Smile -->
  <path d="M 29 35 Q 32 39 35 35" stroke="#1E293B" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Rosy Cheeks -->
  <ellipse cx="20" cy="36" rx="3" ry="1.8" fill="#FF6B8B" opacity="0.55"/>
  <ellipse cx="44" cy="36" rx="3" ry="1.8" fill="#FF6B8B" opacity="0.55"/>

  <!-- Sparkles -->
  <path d="M 10 14 L 11 17 L 14 18 L 11 19 L 10 22 L 9 19 L 6 18 L 9 17 Z" fill="#FBBF24" stroke="#D97706" stroke-width="0.8"/>
  <path d="M 51 10 L 52 13 L 55 14 L 52 15 L 51 18 L 50 15 L 47 14 L 50 13 Z" fill="#FBBF24" stroke="#D97706" stroke-width="0.8"/>
</svg>