<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <filter id="clipShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="1.8" flood-color="#0369A1" flood-opacity="0.2"/>
    </filter>
  </defs>

  <g filter="url(#clipShadow)">
    <!-- Board Base (Blue) -->
    <rect x="11" y="12" width="42" height="46" rx="6" fill="#0284C7" stroke="#0369A1" stroke-width="2.5"/>
    <rect x="13" y="14" width="38" height="42" rx="4" fill="#38BDF8"/>

    <!-- White Paper Sheet -->
    <rect x="17" y="18" width="30" height="34" rx="3" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>

    <!-- Checklist Lines -->
    <line x1="22" y1="25" x2="42" y2="25" stroke="#FCD34D" stroke-width="2" stroke-linecap="round"/>
    <line x1="22" y1="31" x2="42" y2="31" stroke="#FCD34D" stroke-width="2" stroke-linecap="round"/>
    <line x1="22" y1="37" x2="42" y2="37" stroke="#FCD34D" stroke-width="2" stroke-linecap="round"/>
    <line x1="22" y1="43" x2="36" y2="43" stroke="#FCD34D" stroke-width="2" stroke-linecap="round"/>

    <!-- Checkmark Accents -->
    <circle cx="20" cy="25" r="1.2" fill="#0284C7"/>
    <circle cx="20" cy="31" r="1.2" fill="#0284C7"/>
    <circle cx="20" cy="37" r="1.2" fill="#0284C7"/>

    <!-- Top Metal Clip -->
    <path d="M 24 12 C 24 8 40 8 40 12 Z" fill="#7DD3FC" stroke="#0369A1" stroke-width="2"/>
    <rect x="22" y="11" width="20" height="6" rx="2.5" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/>
    <circle cx="32" cy="9" r="1.5" fill="#0369A1"/>
  </g>
</svg>