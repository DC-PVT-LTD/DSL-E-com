<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <radialGradient id="purseGlow" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFB3C6"/>
      <stop offset="40%" stop-color="#FF809F"/>
      <stop offset="90%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </radialGradient>
    <linearGradient id="claspGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="45%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="1.8" flood-color="#881337" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Main Pouch Body -->
  <g filter="url(#dropShadow)">
    <path d="M22 22 C11 26 9 39 9 46 C9 54 18 58 32 58 C46 58 55 54 55 46 C55 39 53 26 42 22 Z" 
          fill="url(#purseGlow)" stroke="#9F1239" stroke-width="2.5" stroke-linejoin="round"/>
  </g>

  <!-- Pouch Highlights -->
  <path d="M15 32 C13 38 13 46 16 50" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M24 25 C16 29 14 39 14 46 C14 53 21 55 32 55 C43 55 50 53 50 46" 
        stroke="#FFF1F2" stroke-width="1.5" stroke-dasharray="2.5,2" fill="none" opacity="0.7"/>

  <!-- Kawaii Face on Purse -->
  <circle cx="26" cy="42" r="2" fill="#4C0519"/>
  <circle cx="38" cy="42" r="2" fill="#4C0519"/>
  <path d="M29.5 44.5 Q32 47 34.5 44.5" stroke="#4C0519" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <ellipse cx="22" cy="44" rx="2.5" ry="1.5" fill="#FFFFFF" opacity="0.55"/>
  <ellipse cx="42" cy="44" rx="2.5" ry="1.5" fill="#FFFFFF" opacity="0.55"/>

  <!-- Golden Metal Clasp Bar -->
  <path d="M19 22 Q32 20 45 22" stroke="url(#claspGold)" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M19 22 Q32 20 45 22" stroke="#B45309" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Twin Clasp Spheres / Knobs -->
  <circle cx="28" cy="14" r="4" fill="url(#claspGold)" stroke="#B45309" stroke-width="1.8"/>
  <circle cx="26.8" cy="12.8" r="1.2" fill="#FFFFFF" opacity="0.8"/>

  <circle cx="36" cy="14" r="4" fill="url(#claspGold)" stroke="#B45309" stroke-width="1.8"/>
  <circle cx="34.8" cy="12.8" r="1.2" fill="#FFFFFF" opacity="0.8"/>
</svg>